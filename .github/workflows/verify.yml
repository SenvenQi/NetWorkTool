name: Verify
on: [push, pull_request]
permissions:
  contents: read
jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: |
            package-lock.json
            frontend/tool/package-lock.json
      - run: npm ci
      - run: npm --prefix frontend/tool ci
      - run: npm run lint
      - run: npm test
      - run: npm --prefix frontend/tool test
      - run: npm run build
      - run: npm run test:database
      - run: npm run test:electron
      - run: npm run test:ui
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: network-tool-ui-screenshots
          path: test-results/ui/*.png
          retention-days: 14
      - run: npx electron-builder --win nsis --x64 --publish never
      - run: npm run test:packaged
      - uses: actions/upload-artifact@v4
        with:
          name: network-tool-windows-x64
          path: |
            build/*.exe
            build/*.exe.blockmap
          if-no-files-found: error
          retention-days: 14
